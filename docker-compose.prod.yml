version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  minio:
    image: minio/minio:latest
    container_name: minio
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  minio-init:
    build: .
    image: backend
    container_name: minio_init
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    command: python scripts/init_minio.py
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - backend_net

  migrate:
    build: .
    image: backend
    container_name: migrate
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend_net

  backend:
    build: .
    image: backend
    container_name: backend
    env_file:
      - .env
    ports:
      - "${WEB_PORT}:8000"
    command: ./entrypoint.sh uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  celery_worker:
    build: .
    image: backend
    container_name: celery_worker
    env_file:
      - .env
    command: celery -A src.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  celery_beat:
    build: .
    image: backend
    container_name: celery_beat
    env_file:
      - .env
    command: celery -A src.celery_app beat --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

  flower:
    build: .
    image: backend
    container_name: flower
    env_file:
      - .env
    ports:
      - "5555:5555"
    command: celery -A src.celery_app flower --port=5555
    depends_on:
      - celery_worker
    environment:
      PYTHONPATH: /app/src
    mem_limit: 512m
    cpus: '1.0'
    restart: always
    networks:
      - backend_net

volumes:
  db_data:
  rabbitmq_data:
  redis_data:
  minio_data:

networks:
  backend_net:
    driver: bridge